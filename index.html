<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>A/B-Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --green:#77A188; --gray:#AEADAA;
  --green-d:#4F7D63; --gray-d:#6F6D68;
  --green-t:#E3ECE6; --gray-t:#E9E8E5;
  --ink:#1D211F; --ink-2:#565B57; --paper:#F4F3F0; --line:#DAD8D3;
  --star:#F2BC2E;
  --sans:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --serif:"IBM Plex Serif",Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.serif{font-family:var(--serif)}
.hidden{display:none!important}

/* ============ PARTICIPANT ============ */
body.part{background:var(--paper);min-height:100%}
.phead{background:var(--green);color:#fff;padding:18px 20px 22px;position:sticky;top:0;z-index:5}
.phead .row{display:flex;justify-content:space-between;align-items:center;font-size:13px;letter-spacing:.02em}
.dots{display:flex;gap:6px}
.dots i{width:22px;height:4px;border-radius:2px;background:rgba(255,255,255,.35);transition:background .4s}
.dots i.on{background:#fff}
.pmain{max-width:560px;margin:0 auto;padding:22px 18px 40px}
.screen{animation:enter .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
.up{animation:up .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.24s}.d4{animation-delay:.32s}
.kicker{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--green-d)}
.ptitle{font-size:30px;line-height:1.08;font-weight:700;letter-spacing:-.01em;margin:10px 0 14px}
.ptext{font-family:var(--serif);font-size:17px;line-height:1.5;color:var(--ink-2)}
.ask{font-size:20px;line-height:1.25;font-weight:700;margin:20px 0 14px}
.shot{position:relative;margin-top:16px;border-radius:14px;overflow:hidden;background:#EBF0F3;box-shadow:0 1px 0 var(--line)}
.shot img{display:block;width:100%;height:auto}
.shot .zoom{position:absolute;right:10px;bottom:10px;background:rgba(29,33,31,.72);color:#fff;font-size:12px;padding:6px 10px;border-radius:20px}
.btn{display:block;width:100%;margin-top:22px;padding:17px 20px;border-radius:12px;background:var(--ink);color:#fff;font-size:17px;font-weight:700;transition:opacity .2s,transform .1s}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.3}
.hint{font-size:13px;color:var(--ink-2);text-align:center;margin-top:10px;font-family:var(--serif);font-style:italic}

/* answer components (shared with beamer mockups) */
.slider{background:#fff;border-radius:14px;padding:20px 18px 16px;border:1px solid var(--line)}
.slider .val{font-size:44px;font-weight:700;letter-spacing:-.02em;text-align:center;line-height:1;font-variant-numeric:tabular-nums}
.slider .val small{font-size:22px;font-weight:400;color:var(--ink-2);margin-left:2px}
.slider .val.empty{color:#C3C1BB}
.slider input{width:100%;margin:18px 0 6px;-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--green) var(--p,0%),#E2E0DB var(--p,0%));outline:none}
.slider input::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:#fff;border:3px solid var(--green);box-shadow:0 2px 6px rgba(0,0,0,.18)}
.slider input::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid var(--green)}
.slider .ends{display:flex;justify-content:space-between;font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:15px 16px;font-size:16px;line-height:1.25;transition:background .2s,border-color .2s,color .2s}
.opt .rad{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid #B9B7B1;transition:all .2s}
.opt .lbl{flex:1}
.opt .star{flex:none;color:var(--star);font-size:17px;line-height:1}
.opt.sel{border-color:var(--green-d);background:var(--green-t)}
.opt.sel .rad{border:6px solid var(--green-d)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:8px;transition:border-color .2s,background .2s}
.tile img{display:block;width:100%;border-radius:6px}
.tile .num{position:absolute;left:14px;top:14px;width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;transition:background .2s}
.tile .cap{font-family:var(--serif);font-size:14px;line-height:1.3;margin:8px 2px 2px;color:var(--ink-2)}
.tile.sel{border-color:var(--green-d);background:var(--green-t)}
.tile.sel .num{background:var(--green-d)}
.done{text-align:center;padding-top:40px}
.done .big{font-size:64px;line-height:1;font-weight:700;color:var(--green-d)}
.sendstate{margin-top:26px;font-size:14px;color:var(--ink-2)}
.lightbox{position:fixed;inset:0;background:rgba(20,22,21,.94);z-index:50;overflow:auto;display:flex;align-items:center;justify-content:center;padding:14px;animation:fade .25s both}
.lightbox img{max-width:none;width:100%;max-width:900px;border-radius:8px}
.lightbox .x{position:fixed;top:12px;right:12px;background:#fff;color:var(--ink);border-radius:20px;padding:8px 14px;font-size:14px;font-weight:700}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ============ HOST / BEAMER ============ */
body.host{overflow:hidden;background:var(--gray);color:#fff}
body.host{font-size:min(1vw,1.7778vh)}
.stage{position:fixed;inset:0;background:linear-gradient(90deg,var(--green) 50%,var(--gray) 50%)}
.slide{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .6s ease}
.slide.on{opacity:1;pointer-events:auto}
.splitT{position:relative;text-align:center;line-height:1.02;white-space:nowrap}
.splitT .l,.splitT .r{display:block}
.splitT .l{font-family:var(--sans);font-weight:700;letter-spacing:-.02em;clip-path:inset(0 50% 0 0)}
.splitT .r{font-family:var(--serif);font-weight:400;position:absolute;inset:0;clip-path:inset(0 0 0 50%)}
.hk{font-size:1.25em;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.half{position:absolute;top:0;bottom:0;width:50%}
.half.L{left:0}.half.R{right:0}
.foot{position:absolute;left:5rem;bottom:2.4rem;font-size:1.15rem;opacity:.9}
.navhint{position:absolute;right:2.4rem;bottom:2rem;display:flex;gap:.6rem;align-items:center;font-size:1rem;opacity:.0;transition:opacity .3s}
body.host:hover .navhint{opacity:.8}
.navhint button{border:1px solid rgba(255,255,255,.6);border-radius:2rem;padding:.4rem 1rem;color:#fff}

/* reveal anims on host */
.slide .a{opacity:0;transform:translateY(1.4rem);transition:opacity .8s cubic-bezier(.2,.8,.2,1),transform .8s cubic-bezier(.2,.8,.2,1)}
.slide.on .a{opacity:1;transform:none}
.slide.on .a1{transition-delay:.15s}.slide.on .a2{transition-delay:.45s}.slide.on .a3{transition-delay:.8s}.slide.on .a4{transition-delay:1.1s}.slide.on .a5{transition-delay:1.4s}
.slide .s2{opacity:0;transform:translateY(1.4rem);transition:opacity .7s cubic-bezier(.2,.8,.2,1),transform .7s cubic-bezier(.2,.8,.2,1)}
.slide.on.step2 .s2{opacity:1;transform:none}
.slide.on.step2 .s2.b{transition-delay:.35s}

/* lobby */
.lobbyL{padding:9rem 5rem 0 5rem}
.lobbyL h1{font-size:5.4rem;line-height:1.02;font-weight:700;letter-spacing:-.025em;margin:1.4rem 0 2rem}
.lobbyL p{font-family:var(--serif);font-size:1.9rem;line-height:1.45;max-width:36rem}
.counter{display:flex;gap:4.5rem;margin-top:4.2rem}
.counter div b{display:block;font-size:6.5rem;font-weight:700;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.counter div span{font-family:var(--serif);font-size:1.6rem;opacity:.9}
.qrwrap{position:absolute;inset:0 0 3rem 0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.qrcard{background:#fff;padding:2.2rem;border-radius:1.4rem;width:31rem;height:31rem;box-shadow:0 1.2rem 3rem rgba(0,0,0,.12)}
.qrcard svg{width:100%;height:100%;display:block}
.qrurl{margin-top:1.6rem;font-family:var(--serif);font-size:1.25rem;opacity:.95;max-width:40rem;word-break:break-all}
.ctrl{position:absolute;left:5rem;bottom:2.2rem;display:flex;gap:.8rem;flex-wrap:wrap}
.ctrl button{border:1px solid rgba(255,255,255,.55);border-radius:2rem;padding:.55rem 1.2rem;font-size:1.05rem;color:#fff;opacity:.75}
.ctrl button:hover{opacity:1}
.conn{position:absolute;right:2.4rem;top:2rem;font-size:1.05rem;display:flex;align-items:center;gap:.6rem;opacity:.85}
.conn i{width:.8rem;height:.8rem;border-radius:50%;background:#E25A4A}
.conn.ok i{background:#CFF5DA}
.badge-sim{position:absolute;right:2.4rem;top:4.2rem;background:#fff;color:var(--ink);font-size:1rem;font-weight:700;padding:.35rem .9rem;border-radius:2rem}
.startbtn{position:absolute;right:2.4rem;bottom:2rem;background:#fff;color:var(--ink);font-weight:700;font-size:1.3rem;padding:1rem 1.8rem;border-radius:3rem;box-shadow:0 .6rem 1.6rem rgba(0,0,0,.12)}

/* reveal slide */
.revealT{position:absolute;left:0;right:0;top:17rem;font-size:7.2rem}
.revealT .splitT+.splitT{margin-top:.1em}
.teamcol{position:absolute;top:38rem;width:50%;text-align:center}
.teamcol .tname{font-size:3.4rem;font-weight:700;letter-spacing:-.02em}
.teamcol .tn{font-family:var(--serif);font-size:1.7rem;margin-top:.6rem;opacity:.92}
.revealSub{position:absolute;left:0;right:0;margin:0 auto;bottom:5.5rem;width:70rem;text-align:center;font-family:var(--serif);font-size:1.75rem;line-height:1.45}

/* question slides */
.qhead{position:absolute;left:0;right:0;top:3.2rem;text-align:center}
.qhead .splitT{font-size:4.6rem;margin-top:.9rem}
.qhead .diff{font-family:var(--serif);font-style:italic;font-size:1.9rem;margin-top:.9rem}
.qhalf{position:absolute;top:15.6rem;width:50%;height:22.5rem;display:flex;align-items:flex-start;justify-content:center;gap:3rem}
.qhalf.L{left:0}.qhalf.R{right:0}
.teamlbl{font-size:1.9rem;font-weight:700}
.teamsaw{font-family:var(--serif);font-size:1.3rem;margin-top:.3rem;opacity:.95}
.mock{width:25rem;margin-top:1rem;background:var(--paper);color:var(--ink);border-radius:1.3rem;padding:1.3rem;box-shadow:0 1rem 2.4rem rgba(0,0,0,.14);font-size:1rem}
.mock .mask{font-size:1.15rem;font-weight:700;line-height:1.25;margin-bottom:.9rem}
.mock .slider{padding:1.2rem 1.1rem 1rem}
.mock .slider .val{font-size:2.6rem}
.mock .slider .val small{font-size:1.3rem}
.mock .slider .ends{font-size:1.05rem}
.mock .slider input{margin:1.1rem 0 .4rem;pointer-events:none}
.mock .slider input::-webkit-slider-thumb{width:1.8rem;height:1.8rem}
.mock .opt{padding:.75rem .9rem;font-size:1.05rem;gap:.7rem;border-radius:.7rem}
.mock .opt .rad{width:1.1rem;height:1.1rem}
.mock .opt .star{font-size:1.25rem}
.mock .opts{gap:.5rem}
.mock .tiles{grid-template-columns:repeat(4,1fr);gap:.45rem}
.mock .tile{padding:.3rem;border-radius:.5rem}
.mock .tile img{border-radius:.25rem}
.mock .tile .num{width:1.4rem;height:1.4rem;font-size:.85rem;left:.5rem;top:.5rem}
.mock .tile .cap{font-size:.8rem;margin:.35rem .1rem .1rem;line-height:1.2}
.mock .hl{outline:.25rem solid var(--star);outline-offset:.25rem;border-radius:.6rem}
.mockwrap{width:25rem;flex:none;transform:translateX(10rem);transform-origin:top left;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.slide.step2 .mockwrap{transform:translateX(2rem) scale(.78)}
.stat{width:19rem;flex:none;padding-top:4.2rem}
.stat .k{font-family:var(--serif);font-size:1.35rem;line-height:1.35}
.stat .v{white-space:nowrap;font-size:5.6rem;font-weight:700;letter-spacing:-.03em;line-height:1;margin:.4rem 0 .6rem;font-variant-numeric:tabular-nums}
.stat .sub{font-family:var(--serif);font-size:1.2rem;opacity:.92;line-height:1.4}
.band{position:absolute;left:50%;transform:translateX(-50%);bottom:2.6rem;width:84rem;background:rgba(255,255,255,.95);color:var(--ink);border-radius:1.2rem;padding:1.6rem 2.4rem 1.5rem;box-shadow:0 1rem 2.6rem rgba(0,0,0,.12)}
.slide .band.s2{transform:translate(-50%,1.4rem)}
.slide.on.step2 .band.s2{transform:translate(-50%,0)}
.verdict{display:flex;justify-content:space-between;align-items:baseline;gap:2rem;margin-top:1rem;padding-top:.9rem;border-top:1px solid var(--line)}
.verdict .vt{flex:1;font-size:1.35rem;font-weight:700}
.verdict .vs{max-width:38rem;font-family:var(--serif);font-size:1.2rem;color:var(--ink-2);text-align:right}
.correct{font-family:var(--serif);font-size:1.15rem;color:var(--ink-2)}
.correct b{font-family:var(--sans);color:var(--ink)}

/* charts */
.dchart{position:relative;height:10.4rem;margin-top:1.2rem;margin:0 1rem 0 7rem}
.drow{position:absolute;left:0;right:0;height:3rem}
.drow .lab{position:absolute;left:-7rem;top:.75rem;font-size:1.2rem;font-weight:700;width:6.5rem}
.drow .rng{position:absolute;top:.3rem;bottom:.3rem;left:0;border-radius:.4rem;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.drow .rng span{position:absolute;white-space:nowrap;top:.6rem;font-size:.9rem;font-family:var(--serif);font-style:italic;color:var(--ink-2)}
.dot{position:absolute;width:1.15rem;height:1.15rem;margin:-.575rem 0 0 -.575rem;border-radius:50%;border:2px solid #fff;transform:scale(0);transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.step2 .dot{transform:scale(1)}
.mean{position:absolute;top:-.1rem;bottom:-.1rem;width:.3rem;margin-left:-.15rem;border-radius:.2rem;background:var(--ink)}
.mean span{position:absolute;left:.5rem;top:-1.45rem;font-size:1.05rem;font-weight:700;white-space:nowrap}
.axis{position:absolute;left:0;right:0;bottom:0;height:1.6rem;border-top:1px solid #BDBBB5}
.axis span{position:absolute;white-space:nowrap;top:.3rem;font-size:.95rem;color:var(--ink-2);transform:translateX(-50%);font-variant-numeric:tabular-nums}
.cline{position:absolute;top:-.6rem;bottom:1.6rem;border-left:.18rem dashed #C9473A}
.cline span{position:absolute;top:-1.2rem;left:.4rem;font-size:1rem;font-weight:700;color:#B23D31;white-space:nowrap}
.bchart{display:grid;grid-template-columns:22rem 1fr;row-gap:.55rem;column-gap:1.4rem;align-items:center}
.bchart .ol{font-size:1.15rem;line-height:1.2;display:flex;align-items:center;gap:.5rem}
.bchart .ol .ok{color:#B23D31;font-weight:700}
.bchart .ol .st{color:var(--star);font-size:1.1rem;white-space:nowrap}
.bchart .ol .st em{font-style:normal;font-size:.85rem;color:var(--ink-2);font-weight:700;margin-left:.1rem}
.bars{display:grid;gap:.22rem}
.bar{display:flex;align-items:center;gap:.6rem;height:1.25rem}
.bar i{display:block;height:100%;border-radius:.25rem;width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.bar b{font-size:.95rem;font-variant-numeric:tabular-nums;min-width:3rem}
.legend{display:flex;gap:1.6rem;font-size:1rem;color:var(--ink-2);margin-bottom:.8rem}
.legend span::before{content:"";display:inline-block;width:.9rem;height:.9rem;border-radius:.2rem;margin-right:.45rem;vertical-align:-.1rem;background:var(--c)}
.cA{background:var(--green-d)}.cB{background:var(--gray-d)}

/* summary */
.sumT{position:absolute;left:0;right:0;top:5rem;font-size:5.4rem}
.sumcard{position:absolute;left:50%;transform:translateX(-50%);top:15.5rem;width:86rem;background:rgba(255,255,255,.95);color:var(--ink);border-radius:1.2rem;padding:1.2rem 2.4rem;box-shadow:0 1rem 2.6rem rgba(0,0,0,.12)}
.slide .sumcard.a{transform:translate(-50%,1.4rem)}
.slide.on .sumcard.a{transform:translate(-50%,0)}
.srow{display:grid;grid-template-columns:15rem 21rem 13rem 13rem 1fr;gap:1.4rem;align-items:center;padding:1.15rem 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow.h{font-size:1rem;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em;padding:.6rem 0}
.srow .q{font-size:1.4rem;font-weight:700}
.srow .w{font-family:var(--serif);font-size:1.2rem;line-height:1.35}
.srow .n{font-size:2.4rem;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.srow .n small{display:block;font-size:.95rem;font-weight:400;color:var(--ink-2);letter-spacing:0;font-family:var(--serif)}
.srow .p{font-family:var(--serif);font-size:1.15rem;line-height:1.35}
.srow .p b{font-family:var(--sans)}
.sumfoot{position:absolute;left:0;right:0;margin:0 auto;bottom:3rem;width:80rem;text-align:center;font-family:var(--serif);font-size:1.6rem;line-height:1.45}
.empty{font-family:var(--serif);font-style:italic;color:var(--ink-2);font-size:1.2rem;padding:1rem 0}
</style>
</head>

    intro:'Die Berliner Zeitung hat ihre Paywall in vier Designs gegeneinander getestet.',
    ask:'Welche Variante hat die meisten digitalen Abo-Abschlüsse gebracht?',
    options:[1,2,3,4],
    captions:['Kontrollscreen','Blaues Pop-up-Fenster','Pop-up-Fenster über dem Artikel','Übersichtliche Darstellung der Abo-Optionen'],
    captionsFor:'B', correct:3, lure:4, misled:'B',
    diff:'Wertende Bildunterschriften', saw:{A:'Nur Nummern 1–4',B:'Bildunterschriften unter jeder Variante'},
    fact:'Variante 3: +18,23 % digitale Abschlüsse, +333,90 % Micro-Conversions' }
];
const optLabel = (q,v)=> q.kind==='choice' ? q.options.find(o=>o[0]===v)[1].replace(/ \(.*\)/,'') : 'Variante '+v;

/* ---------- Relay (ntfy.sh, ohne Login) ---------- */
async function relayPost(topic,obj){
  const r = await fetch(RELAY+'/'+topic,{method:'POST',body:JSON.stringify(obj)});
  if(!r.ok) throw new Error('HTTP '+r.status);
}
async function relayPoll(topic){
  const r = await fetch(RELAY+'/'+topic+'/json?poll=1&since=all');
  if(!r.ok) throw new Error('HTTP '+r.status);
  const t = await r.text(); const out=[];
  t.split('\n').forEach(l=>{ if(!l.trim())return; try{const d=JSON.parse(l); if(d.event==='message'){out.push(JSON.parse(d.message));}}catch(e){} });
  return out;
}

/* ---------- Antwort-Komponenten (Handy + Beamer-Mockups) ---------- */
function answerHTML(q,g,mock){
  if(q.kind==='slider'){
    const m=q.max[g];
    return `<div class="slider"><div class="val empty" data-val>–<small> %</small></div>
      <input type="range" min="0" max="${m}" step="0.1" value="0" aria-label="Schätzung in Prozent">
      <div class="ends"><span>0 %</span><span>${m} %</span></div></div>`;
  }
  if(q.kind==='choice'){
    return `<div class="opts">${q.options.map(([v,l])=>`<button class="opt" data-v="${v}"><span class="rad"></span><span class="lbl">${esc(l)}</span>${q.star[g]===v?'<span class="star" aria-hidden="true">★</span>':''}</button>`).join('')}</div>`;
  }
  const caps = q.captionsFor===g;
  return `<div class="tiles">${q.options.map((v,i)=>`<button class="tile" data-v="${v}"><img src="${IMG['bz'+v]}" alt="Paywall Variante ${v}"><span class="num">${v}</span>${caps?`<div class="cap">${esc(q.captions[i])}</div>`:''}</button>`).join('')}</div>`;
}

function participant(){
  document.body.className='part';
  const topic = P.get('s');
  const app = $('#app');
  if(!topic){
    app.innerHTML=`<div class="phead"><div class="row"><span>A/B-Testing · Quiz</span></div></div><div class="pmain"><div class="screen"><p class="ptitle">Bitte scanne den QR-Code auf der Leinwand.</p></div></div>`;
    return;
  }
  const KEY='abq_'+topic;
  let st = ls.get(KEY) || {pid:rid(10), g:null, joined:false, step:0, ans:{}, sent:false};
  const save=()=>ls.set(KEY,st);
  let groupReady = !!st.g;

  async function assign(){
    if(st.g){groupReady=true;return;}
    let g=null;
    try{
      const msgs = await relayPoll(topic);
      const c={A:new Set(),B:new Set()};
      msgs.forEach(m=>{ if(m && (m.t==='j'||m.t==='a') && c[m.g]) c[m.g].add(m.p); });
      const d=c.A.size-c.B.size, small=d<0?'A':'B'; if(Math.abs(d)>=2) g=small; else if(Math.abs(d)===1) g=Math.random()<.75?small:(small==='A'?'B':'A');
    }catch(e){}
    st.g = g || (Math.random()<.5?'A':'B'); save(); groupReady=true;
    if(!st.joined){
      try{ await relayPost(topic,{t:'j',p:st.pid,g:st.g}); st.joined=true; save(); }catch(e){}
    }
  }
  const assigning = assign();

  app.innerHTML=`<div class="phead"><div class="row"><span>A/B-Testing · Quiz</span><span class="dots"><i></i><i></i><i></i></span></div></div><main class="pmain" id="pm"></main>`;
  const pm=$('#pm');
  function dots(n){ document.querySelectorAll('.dots i').forEach((d,i)=>d.classList.toggle('on',i<n)); }

  function start(){
    dots(0);
    pm.innerHTML=`<section class="screen">
      <div class="kicker up">Kurzes Quiz</div>
      <h1 class="ptitle up d1">Drei echte A/B-Tests. Was schätzt du?</h1>
      <p class="ptext up d2">Drei Fragen, etwa zwei Minuten. Es gibt keine Punkte und keinen Gewinner – nimm dir also ruhig Zeit und schau dir die Screens genau an.</p>
      <button class="btn up d3" id="go" ${groupReady?'':'disabled'}>${groupReady?'Los geht’s':'Einen Moment …'}</button>
    </section>`;
    const go=$('#go');
    if(!groupReady){ Promise.race([assigning,new Promise(r=>setTimeout(r,5000))]).then(()=>{ if(!st.g){st.g=Math.random()<.5?'A':'B';save();} go.disabled=false; go.textContent='Los geht’s'; }); }
    go.onclick=()=>{ st.step=1; save(); render(); };
  }

  function question(i){
    const q=Q[i]; const g=st.g; dots(i+1);
    const last = i===Q.length-1;
    pm.innerHTML=`<section class="screen">
      <div class="kicker">Frage ${i+1} von ${Q.length} · ${esc(q.brand)}</div>
      <p class="ptext" style="margin-top:10px">${esc(q.intro)}</p>
      ${q.img?`<button class="shot" id="shot"><img src="${IMG[q.img]}" alt="${esc(q.brand)}: Variante A und B"><span class="zoom">Tippen zum Vergrößern</span></button>`:''}
      <h2 class="ask">${esc(q.ask)}</h2>
      <div id="ans">${answerHTML(q,g)}</div>
      <button class="btn" id="next" disabled>${last?'Absenden':'Weiter'}</button>
      ${q.kind==='slider'?'<p class="hint" id="hint">Schieb den Regler auf deine Schätzung.</p>':''}
      ${q.kind==='tiles'?'<p class="hint">Tippe auf einen Screen, um ihn auszuwählen. <a href="#" id="zoomAll" style="color:inherit">Alle vier groß ansehen</a></p>':''}
    </section>`;
    window.scrollTo(0,0);
    const next=$('#next'); let val = st.ans[q.id];
    if(q.img) $('#shot').onclick=()=>lightbox(IMG[q.img]);
    if(q.kind==='slider'){
      const inp=$('#ans input'), out=$('#ans [data-val]');
      const upd=(touched)=>{ const v=+inp.value; inp.style.setProperty('--p',(100*v/q.max[g])+'%'); if(touched){ out.classList.remove('empty'); out.innerHTML=fmt(v)+'<small> %</small>'; val=v; next.disabled=false; const h=$('#hint'); if(h) h.style.visibility='hidden'; } };
      if(typeof val==='number'){ inp.value=val; upd(true);} else upd(false);
      inp.addEventListener('input',()=>upd(true));
    } else {
      const items=[...document.querySelectorAll('#ans [data-v]')];
      const sel=v=>{ items.forEach(b=>b.classList.toggle('sel',String(b.dataset.v)===String(v))); val = q.kind==='tiles'?+v:v; next.disabled=false; };
      if(val!=null) sel(val);
      items.forEach(b=>{ b.onclick=()=>sel(b.dataset.v); });
      const za=$('#zoomAll'); if(za) za.onclick=e=>{e.preventDefault();lightbox(IMG.bzall);};
    }
    next.onclick=()=>{ st.ans[q.id]=val; st.step=i+2; save(); if(last) submit(); render(); };
  }

  async function submit(){
    await Promise.race([assigning,new Promise(r=>setTimeout(r,4000))]);
    for(let k=0;k<20 && !st.sent;k++){
      try{ await relayPost(topic,{t:'a',p:st.pid,g:st.g,a:st.ans}); st.sent=true; save(); }
      catch(e){ await new Promise(r=>setTimeout(r,3000+Math.random()*3000)); }
      const s=$('#sendstate'); if(s) s.textContent = st.sent?'Antworten gespeichert ✓':'Antworten werden gesendet …';
    }
    const s=$('#sendstate'); if(s) s.textContent = st.sent?'Antworten gespeichert ✓':'Senden hat nicht geklappt – bitte Seite neu laden.';
  }

  function done(){
    dots(3);
    pm.innerHTML=`<section class="screen done">
      <div class="big up">✓</div>
      <h1 class="ptitle up d1">Danke!</h1>
      <p class="ptext up d2">Schau jetzt wieder nach vorne – gleich geht’s weiter.</p>
      <p class="sendstate up d3" id="sendstate">${st.sent?'Antworten gespeichert ✓':'Antworten werden gesendet …'}</p>
    </section>`;
    if(!st.sent) submit();
  }

  function render(){ if(st.step===0) start(); else if(st.step<=Q.length) question(st.step-1); else done(); }
  render();
}

function lightbox(src){
  const d=document.createElement('div'); d.className='lightbox';
  d.innerHTML=`<img src="${src}" alt=""><button class="x">Schließen</button>`;
  d.onclick=()=>d.remove(); document.body.appendChild(d);
}

    <button class="startbtn" id="bGo">Weiter →</button>
  </section>

  <section class="slide" data-id="reveal">
    <div class="revealT a a1">
      <div class="splitT"><span class="l">Ihr wart gerade</span><span class="r">Ihr wart gerade</span></div>
      <div class="splitT"><span class="l">Teil eines A/B-Tests.</span><span class="r">Teil eines A/B-Tests.</span></div>
    </div>
    <div class="teamcol a a3" style="left:0"><div class="tname">Team A</div><div class="tn" id="nA"></div></div>
    <div class="teamcol a a3" style="right:0"><div class="tname">Team B</div><div class="tn" id="nB"></div></div>
    <p class="revealSub a a4">Beim Scannen wurdet ihr zufällig auf zwei Gruppen verteilt. Bei jeder Frage hat eine Gruppe eine kleine Designänderung gesehen – abwechselnd mal Team A, mal Team B. Hat sie eure Antworten verändert?</p>
  </section>

  ${Q.map((q,i)=>`
  <section class="slide" data-id="${q.id}">
    <div class="qhead">
      <div class="hk a a1">Frage ${i+1} · ${esc(q.brand)}</div>
      <div class="splitT a a1"><span class="l">Was war anders?</span><span class="r">Was war anders?</span></div>
      <div class="diff a a2">${esc(q.diff)}</div>
    </div>
    ${['A','B'].map(g=>`
    <div class="qhalf ${g==='A'?'L':'R'}">
      <div class="a a3"><div class="mockwrap">
        <div class="teamlbl">Team ${g}</div>
        <div class="teamsaw">sah: ${esc(q.saw[g])}</div>
        <div class="mock"><div class="mask">${esc(q.ask)}</div>${answerHTML(q,g,true)}</div>
      </div></div>
      <div class="stat s2" id="${q.id}stat${g}"></div>
    </div>`).join('')}

  </section>`).join('')}

  <section class="slide" data-id="sum">
    <div class="sumT a a1"><div class="splitT"><span class="l">Was heißt das?</span><span class="r">Was heißt das?</span></div></div>
    <div class="sumcard a a2" id="sumcard"></div>
    <p class="sumfoot a a4" id="sumfoot"></p>
  </section>
  <div class="navhint"><button id="bPrev">←</button><button id="bNext">→</button></div>`;

  // Stern im Mockup für Beamer hervorheben (dezent im Handy, deutlich auf dem Beamer)
  Q.forEach(q=>{
    if(q.kind==='choice') ['A','B'].forEach(g=>{
      const half=stage.querySelector(`[data-id="${q.id}"] .qhalf.${g==='A'?'L':'R'}`);
      const b=half.querySelector(`.opt[data-v="${q.star[g]}"]`); if(b) b.classList.add('hl');
    });
    if(q.kind==='tiles'){
      const half=stage.querySelector(`[data-id="${q.id}"] .qhalf.R .tiles`); if(half) half.classList.add('hl');
    }
    if(q.kind==='slider') stage.querySelectorAll(`[data-id="${q.id}"] .mock .ends span:last-child`).forEach(s=>s.classList.add('hl'));
  });

  // QR
  try{ const qr=qrcode(0,'M'); qr.addData(joinUrl); qr.make(); $('#qr').innerHTML=qr.createSvgTag({scalable:true,margin:0}); }catch(e){ $('#qr').textContent='QR-Fehler'; }

  /* --- Controls --- */
  const fs=()=>{ if(!document.fullscreenElement) document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); else document.exitFullscreen(); };
  $('#bFs').onclick=fs;
  $('#bNew').onclick=()=>{ if(confirmNew()){ ls.del('abHostTopic'); location.href=base+'#host'; location.reload(); } };
  function confirmNew(){ const b=$('#bNew'); if(b.dataset.armed){return true;} b.dataset.armed=1; b.textContent='Wirklich? Nochmal klicken'; setTimeout(()=>{delete b.dataset.armed;b.textContent='Neue Session';},3000); return false; }
  const simLabel=()=>{ $('#bSim').textContent = sim?'Testdaten aus':'Probelauf mit Testdaten'; $('#simBadge').classList.toggle('hidden',!sim); };
  $('#bSim').onclick=()=>{ sim=!sim; ls.set('abSim_'+topic,sim); simLabel(); refresh(); };
  simLabel();
  $('#bGo').onclick=()=>go(1,1);
  $('#bNext').onclick=next; $('#bPrev').onclick=prev;
  document.addEventListener('keydown',e=>{
    if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();next();}
    else if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){e.preventDefault();prev();}
    else if(e.key==='f'||e.key==='F') fs();
  });
  function next(){ const s=SL[cur.s]; if(cur.step<s.steps) go(cur.s,cur.step+1); else if(cur.s<SL.length-1) go(cur.s+1,1); }
  function prev(){ if(cur.step>1) go(cur.s,cur.step-1); else if(cur.s>0) go(cur.s-1,SL[cur.s-1].steps); }
  function go(s,step){
    cur={s,step};
    stage.querySelectorAll('.slide').forEach(el=>{
      const on = el.dataset.id===SL[s].id;
      el.classList.toggle('on',on); el.classList.toggle('step2',on&&step>=2);
    });
    refresh();
    if(step>=2) countUp(stage.querySelector(`.slide[data-id="${SL[s].id}"]`));
    if(SL[s].id==='sum') countUp(stage.querySelector('.slide[data-id="sum"]'));
  }

  /* --- Daten --- */
  function data(){
    const src = sim ? (simPeople||(simPeople=makeSim())) : people;
    const all=[...src.values()];
    return { joined: all.length, done: all.filter(p=>p.a).map(p=>({g:p.g,a:p.a})) };
  }
  function handle(m){
    if(!m||!m.p||!(m.g==='A'||m.g==='B')) return;
    const p=people.get(m.p)||{g:m.g,a:null};
    p.g=m.g; if(m.t==='a' && m.a) p.a=m.a;
    people.set(m.p,p);
  }
  let rt=null; const refreshSoon=()=>{ clearTimeout(rt); rt=setTimeout(refresh,250); };

  // Live-Verbindung (Server-Sent Events). Fallback: Polling.
  const seen=new Set(); let es=null, pollT=null;
  function setConn(ok,txt){ const c=$('#conn'); c.classList.toggle('ok',ok); c.querySelector('span').textContent=txt; }
  function connect(){
    try{
      es=new EventSource(RELAY+'/'+topic+'/sse?since=all');
      es.onopen=()=>setConn(true,'verbunden');
      es.onmessage=e=>{ try{ const d=JSON.parse(e.data); if(d.event!=='message'||seen.has(d.id))return; seen.add(d.id); handle(JSON.parse(d.message)); refreshSoon(); }catch(x){} };
      es.onerror=()=>{ setConn(false,'Verbindung unterbrochen – versuche erneut …'); if(es.readyState===2){ es=null; startPoll(); } };
    }catch(e){ startPoll(); }
  }
  function startPoll(){
    if(pollT) return;
    const tick=async()=>{ try{ const ms=await relayPoll(topic); ms.forEach(handle); setConn(true,'verbunden (Polling)'); refresh(); }catch(e){ setConn(false,'keine Verbindung'); } };
    tick(); pollT=setInterval(tick,6000);
  }
  connect();

  /* --- Render --- */
  function refresh(){
    const D=data();
    $('#cJoin').textContent=D.joined; $('#cDone').textContent=D.done.length;
    const nA=D.done.filter(p=>p.g==='A').length, nB=D.done.length-nA;
    $('#nA').textContent=nA+(nA===1?' Person':' Personen'); $('#nB').textContent=nB+(nB===1?' Person':' Personen');
    const R = Q.map(q=>analyze(q,D.done));
    Q.forEach((q,i)=>renderQ(q,R[i]));
    renderSum(R,D.done.length);
  }

  function analyze(q,done){
    const by={A:[],B:[]};
    done.forEach(p=>{ const v=p.a&&p.a[q.id]; if(v!==undefined&&v!==null) by[p.g].push(v); });
    const r={q,by,nA:by.A.length,nB:by.B.length};
    if(q.kind==='slider'){
      const m=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:NaN;
      const med=a=>{ if(!a.length)return NaN; const s=[...a].sort((x,y)=>x-y),k=s.length>>1; return s.length%2?s[k]:(s[k-1]+s[k])/2; };
      r.mean={A:m(by.A),B:m(by.B)}; r.med={A:med(by.A),B:med(by.B)};
      r.p = (by.A.length>=2&&by.B.length>=2) ? permTest(by.A,by.B) : null;
    } else {
      const keys=q.kind==='choice'?q.options.map(o=>o[0]):q.options;
      r.keys=keys;
      r.share={A:{},B:{}};
      ['A','B'].forEach(g=>keys.forEach(k=>{ r.share[g][k]=pct(by[g].filter(v=>String(v)===String(k)).length,by[g].length); }));
      r.lure={A:by.A.filter(v=>String(v)===String(q.lure)).length,B:by.B.filter(v=>String(v)===String(q.lure)).length};
      r.right={A:by.A.filter(v=>String(v)===String(q.correct)).length,B:by.B.filter(v=>String(v)===String(q.correct)).length};
      r.p = (by.A.length&&by.B.length) ? fisher(r.lure.A,by.A.length-r.lure.A,r.lure.B,by.B.length-r.lure.B) : null;
    }
    return r;
  }

  function verdictText(p){
    if(p==null) return 'Noch zu wenige Antworten für eine Einschätzung.';
    const ps= p<0.001 ? 'p\u00a0<\u00a00,001' : 'p\u00a0=\u00a0'+fmt(p,p<0.01?3:2);
    if(p<0.05) return 'Deutlicher Unterschied – sehr wahrscheinlich kein Zufall ('+ps+')';
    if(p<0.15) return 'Tendenz erkennbar, bei so wenigen Leuten aber nicht sicher ('+ps+')';
    return 'Kein klarer Unterschied – das könnte auch Zufall sein ('+ps+')';
  }
  const cnt=(v,suffix='',dec=0)=>`<span data-count="${isFinite(v)?v:''}" data-dec="${dec}" data-suf="${esc(suffix)}">${isFinite(v)?fmt(v,dec)+suffix:'–'}</span>`;

  function renderQ(q,r){
    const sel=id=>document.getElementById(id);
    if(q.kind==='slider'){
      ['A','B'].forEach(g=>{
        sel(q.id+'stat'+g).innerHTML=`<div class="k">Durchschnittliche Schätzung</div><div class="v">${cnt(r.mean[g],' %',1)}</div><div class="sub">Median ${isFinite(r.med[g])?fmt(r.med[g])+' %':'–'} · n = ${r['n'+g]}</div>`;
      });
      const X=v=>(100*Math.min(v,40)/40)+'%';
      const row=(g,top)=>{
        const vals=[...r.by[g]].sort((a,b)=>a-b); let lastX=-9,lvl=0;
        const dots=vals.map((v,i)=>{ if(v-lastX<0.9){lvl++;}else{lvl=0;} lastX=v; const off=[0,-0.75,0.75,-1.5,1.5][lvl%5]; return `<i class="dot ${g==='A'?'cA':'cB'}" style="left:${X(v)};top:calc(50% + ${off}rem);transition-delay:${(.15+i*.05).toFixed(2)}s"></i>`; }).join('');
        const mean=isFinite(r.mean[g])?`<div class="mean" style="left:${X(r.mean[g])}"><span>Ø ${fmt(r.mean[g])} %</span></div>`:'';
        return `<div class="drow" style="top:${top}rem"><div class="lab">Team ${g}</div><div class="rng" style="width:${X(q.max[g])};background:${g==='A'?'var(--green-t)':'var(--gray-t)'}"><span style="${q.max[g]<40?'left:calc(100% + .7rem)':'right:.6rem'}">Skala bis ${q.max[g]} %</span></div>${dots}${mean}</div>`;
      };
      const diff = (isFinite(r.mean.A)&&isFinite(r.mean.B)) ? `Team B hat im Schnitt ${fmt(Math.abs(r.mean.B-r.mean.A))} Prozentpunkte ${r.mean.B>=r.mean.A?'höher':'niedriger'} geschätzt als Team A.` : 'Noch keine Antworten.';
      sel(q.id+'band').innerHTML=`
        <div class="dchart">
          ${row('A',0.6)}${row('B',4.2)}
          <div class="cline" style="left:${X(q.correct)}"><span>Richtig: 8,48 %</span></div>
          <div class="axis">${[0,10,20,30,40].map(t=>`<span style="left:${X(t)}">${t} %</span>`).join('')}</div>
        </div>
        <div class="verdict"><div class="vt">${diff}</div><div class="vs">${verdictText(r.p)}</div></div>`;
    } else {
      const lureL=optLabel(q,q.lure), rightL=optLabel(q,q.correct);
      ['A','B'].forEach(g=>{
        const n=r['n'+g];
        sel(q.id+'stat'+g).innerHTML=`<div class="k">wählten „${esc(lureL)}“</div><div class="v">${cnt(pct(r.lure[g],n),' %')}</div><div class="sub">Richtig („${esc(rightL)}“): ${pct(r.right[g],n)} %<br>n = ${n}</div>`;
      });
      const rows=r.keys.map(k=>{
        const lab=q.kind==='choice'?q.options.find(o=>o[0]===k)[1]:'Variante '+k+(q.captions?` <span style="color:var(--ink-2);font-family:var(--serif);font-size:.95rem">– ${esc(q.captions[k-1])}</span>`:'');
        const stars=q.kind==='choice'?['A','B'].filter(g=>q.star[g]===k).map(g=>`<span class="st">★<em>${g}</em></span>`).join(''):'';
        const ok=String(k)===String(q.correct)?'<span class="ok">✓</span>':'';
        return `<div class="ol">${ok}<span>${lab}</span>${stars}</div>
          <div class="bars">${['A','B'].map((g,j)=>`<div class="bar"><i class="${g==='A'?'cA':'cB'}" data-w="${r.share[g][k]}" style="transition-delay:${(.3+j*.12).toFixed(2)}s"></i><b>${r['n'+g]?r.share[g][k]+' %':'–'}</b></div>`).join('')}</div>`;
      }).join('');
      const m=q.misled, o=m==='A'?'B':'A';
      const line = (r.nA&&r.nB) ? `Team ${m} (gelenkt): ${pct(r.lure[m],r['n'+m])} % wählten „${esc(lureL)}“ – Team ${o}: ${pct(r.lure[o],r['n'+o])} %` : 'Noch keine Antworten.';
      sel(q.id+'band').innerHTML=`
        <div class="legend"><span style="--c:var(--green-d)">Team A</span><span style="--c:var(--gray-d)">Team B</span><span style="--c:transparent;margin-left:auto" class="correct">✓ = richtige Antwort · ${esc(q.fact)}</span></div>
        <div class="bchart">${rows}</div>
        <div class="verdict"><div class="vt">${line}</div><div class="vs">${verdictText(r.p)}</div></div>`;
    }
    // Balken animieren, wenn sichtbar
    const sl=stage.querySelector(`.slide[data-id="${q.id}"]`);
    const show=sl.classList.contains('step2');
    sl.querySelectorAll('.bar i').forEach(i=>{ i.style.width = show ? (Math.max(+i.dataset.w,0.6)*0.82)+'%' : '0'; });
  }

  function renderSum(R,n){
    const m=(v)=>isFinite(v)?fmt(v)+' %':'–';
    const rows=R.map((r,i)=>{
      const q=r.q;
      let a,b,lab;
      if(q.kind==='slider'){ a=m(r.mean.A); b=m(r.mean.B); lab='Ø Schätzung'; }
      else { a=pct(r.lure.A,r.nA)+' %'; b=pct(r.lure.B,r.nB)+' %'; lab='wählten „'+optLabel(q,q.lure)+'“'; }
      return `<div class="srow"><div class="q">${i+1} · ${esc(q.brand)}</div><div class="w">${esc(q.diff)}<br><span style="color:var(--ink-2);font-size:1rem">gelenkt: Team ${q.misled}</span></div>
        <div class="n">${a}<small>Team A · ${lab}</small></div><div class="n">${b}<small>Team B · ${lab}</small></div>
        <div class="p"><b>${r.p!=null&&r.p<0.05?'Signifikant':r.p!=null&&r.p<0.15?'Tendenz':'Unklar'}</b><br>${r.p==null?'zu wenige Daten':r.p<0.001?'p < 0,001':'p = '+fmt(r.p,r.p<0.01?3:2)}</div></div>`;
    }).join('');
    $('#sumcard').innerHTML=`<div class="srow h"><div>Frage</div><div>Was war anders</div><div>Team A</div><div>Team B</div><div>Zufall?</div></div>${rows}
      <div class="correct" style="padding:.9rem 0 .3rem">Richtige Antworten: <b>8,48 %</b> ARPU · <b>Gesunken</b> (−6,06 % Bestellungen) · <b>Variante 3</b> (+18,23 % Abschlüsse)</div>`;
    $('#sumfoot').textContent = n+' Teilnehmende sind keine echte Stichprobe – aber genug, um zu sehen, wie stark kleine Designentscheidungen Antworten verschieben können.';
  }

  function countUp(root){
    root.querySelectorAll('[data-count]').forEach(el=>{
      const t=parseFloat(el.dataset.count); if(!isFinite(t))return;
      const dec=+el.dataset.dec, suf=el.dataset.suf, t0=performance.now(), dur=1100;
      const f=now=>{ const k=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-k,3); el.textContent=fmt(t*e,dec)+suf; if(k<1) requestAnimationFrame(f); };
      requestAnimationFrame(f);
    });
    root.querySelectorAll('.bar i').forEach(i=>{ i.style.width=(Math.max(+i.dataset.w,0.6)*0.82)+'%'; });
  }

  function makeSim(){
    const m=new Map(); const rnd=(a,b)=>a+Math.random()*(b-a);
    for(let i=0;i<20;i++){
      const g=i%2?'B':'A';
      const q1= g==='A'? Math.min(10,Math.max(0.5,rnd(2.5,8.5))) : Math.min(40,Math.max(1,rnd(6,28)));
      const q2pool = g==='A'? ['stark','stark','stark','stark','leicht','leicht','gesunken','kaum','stark','gesunken'] : ['gesunken','gesunken','leicht','stark','kaum','gesunken','leicht','gesunken','stark','leicht'];
      const q3pool = g==='B'? [4,4,4,4,3,4,2,3,4,1] : [3,4,2,3,3,4,1,3,2,4];
      m.set('sim'+i,{g,a:{q1:Math.round(q1*10)/10,q2:q2pool[i>>1],q3:q3pool[i>>1]}});
    }
    return m;
  }

  go(0,1);
}

/* ---------- Statistik ---------- */
function permTest(a,b,iters=20000){
  const all=a.concat(b), n=a.length, mean=x=>x.reduce((s,v)=>s+v,0)/x.length;
  const obs=Math.abs(mean(a)-mean(b)); let c=0; const arr=all.slice();
  for(let k=0;k<iters;k++){
    for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=arr[i]; arr[i]=arr[j]; arr[j]=t; }
    let s1=0,s2=0; for(let i=0;i<arr.length;i++){ if(i<n) s1+=arr[i]; else s2+=arr[i]; }
    if(Math.abs(s1/n-s2/(arr.length-n))>=obs-1e-12) c++;
  }
  return (c+1)/(iters+1);
}
function fisher(a,b,c,d){ // zweiseitiger exakter Test nach Fisher
  const lf=n=>{let s=0;for(let i=2;i<=n;i++)s+=Math.log(i);return s;};
  const r1=a+b,r2=c+d,c1=a+c,N=r1+r2;
  const pr=x=>Math.exp(lf(r1)+lf(r2)+lf(c1)+lf(N-c1)-lf(N)-lf(x)-lf(r1-x)-lf(c1-x)-lf(r2-c1+x));
  const p0=pr(a); let p=0;
  for(let x=Math.max(0,c1-r2);x<=Math.min(r1,c1);x++){ const px=pr(x); if(px<=p0*(1+1e-9)) p+=px; }
  return Math.min(1,p);
}
